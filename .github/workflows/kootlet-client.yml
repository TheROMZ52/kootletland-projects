name: Build KootletClient
on:
  push:
    paths:
      - 'KootletClient/**'
      - '.github/workflows/kootlet-client.yml'
  pull_request:
    paths:
      - 'KootletClient/**'
      - '.github/workflows/kootlet-client.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KootletClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Get Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
      - name: Build
        run: ./gradle-2.14.1/bin/gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KootletClient
          path: KootletClient/build/libs/*.jar
      - name: Publish release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete kootlet-client-latest --yes --cleanup-tag || true
          gh release create kootlet-client-latest KootletClient/build/libs/*.jar \
            --target "${{ github.sha }}" \
            --title "Kootlet Client (latest)" \
            --notes "Latest build of Kootlet Client for Minecraft 1.8.9 + Forge 11.15.1.2318. Drop the jar into .minecraft/mods."
